name: Mirror to Stitchflow Builders

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  delete:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: mirror-to-stitchflow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'shashank-sn/holdyourvoice' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push source branches and tags to the private mirror
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "${MIRROR_DEPLOY_KEY:-}" ]; then
            echo "::error::MIRROR_DEPLOY_KEY is not configured in the source repository."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add mirror git@github.com:stitchflow-builders/holdyourvoice.git
          node scripts/mirror-refs.mjs
